# SpiceDB Operator — CLUSTER-SCOPED install (the normal default).
#
# Vendored from authzed/spicedb-operator v1.27.0 bundle.yaml with two OpenShift
# fixes baked in (previously separate files, now superseded by this one):
#   - memory 256Mi/512Mi (upstream 160Mi limit OOMKills) [operator-memory-patch.yaml]
#   - nonroot-v2 SCC RoleBinding for the distroless UID 65532 [operator-install.yaml]
# The operator watches ALL namespaces. For widely-shared clusters prefer the
# namespaced variant: deploy/spicedb/operator-namespaced.yaml
#   (SPICEDB_OPERATOR_SCOPE=namespaced ./scripts/deploy-all.sh)
# Install: ./scripts/install-spicedb-operator.sh <namespace> cluster
# The CRD (deploy/spicedb/crd.yaml) is installed separately, once per cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: spicedb-operator
  name: spicedb-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spicedb-operator
  namespace: spicedb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spicedb-operator
rules:
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  - jobs
  - secrets
