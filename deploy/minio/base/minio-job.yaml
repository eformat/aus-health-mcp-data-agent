apiVersion: batch/v1
kind: Job
metadata:
  name: minio-configure
  labels:
    app.kubernetes.io/name: minio
spec:
  template:
    metadata:
      name: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # minio/mc images were removed from docker.io (archive) — pgsty/silo
          # ships mc at /usr/bin/mc
          image: pgsty/silo:latest # quay.io/eformat/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 minio minio1234 &&
              mc mb --ignore-existing local/nndss-data &&
              echo "Bucket nndss-data ready"
