---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  labels:
    app: nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nessie
  template:
    metadata:
      labels:
        app: nessie
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nessie
          # Pinned: ':latest' + Always pulled a newer Nessie whose renamed config
          # property silently ignored the old env var, dropping the version store
          # to ephemeral /tmp (catalog refs wiped on every container restart).
          # (latest release at time of writing: 0.109.0)
          image: ghcr.io/projectnessie/nessie:0.109.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 19120
              protocol: TCP
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: NESSIE_VERSION_STORE_TYPE
              value: ROCKSDB
            # 2.x property: nessie.version.store.persist.rocks.database-path
            # (pre-2.x name NESSIE_VERSION_STORE_PERSIST_ROCKS_DB_DATABASE_PATH is ignored)
            - name: NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH
              value: /nessie/rocksdb
          volumeMounts:
            - name: nessie-data
              mountPath: /nessie/rocksdb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nessie-data
          persistentVolumeClaim:
            claimName: nessie-rocksdb
