---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  labels:
    app: nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nessie
  template:
    metadata:
      labels:
        app: nessie
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nessie
          image: ghcr.io/projectnessie/nessie:latest
          ports:
            - containerPort: 19120
              protocol: TCP
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: NESSIE_VERSION_STORE_TYPE
              value: ROCKSDB
            - name: NESSIE_VERSION_STORE_PERSIST_ROCKS_DB_DATABASE_PATH
              value: /nessie/rocksdb
          volumeMounts:
            - name: nessie-data
              mountPath: /nessie/rocksdb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nessie-data
          persistentVolumeClaim:
            claimName: nessie-rocksdb
